version: '3.8'

services:

  # ─── MariaDB ───────────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: finance-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      ${MARIADB_DATABASE:-finance_db}
      MYSQL_USER:          ${MARIADB_USER:-jhy}
      MYSQL_PASSWORD:      ${MARIADB_PASSWORD:-1234}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d   # sql/ 폴더에 .sql 파일 놓으면 최초 1회 자동 import
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Spring Boot App ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-app:local
    container_name: finance-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker 내부 DB 연결 (service명 'db' 사용)
      DB_URL: jdbc:mariadb://db:3306/${MARIADB_DATABASE:-finance_db}?createDatabaseIfNotExist=true
      DB_USERNAME: ${MARIADB_USER:-jhy}
      DB_PASSWORD: ${MARIADB_PASSWORD:-1234}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - upload_data:/app/uploads
      - info_upload_data:/app/info_uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  upload_data:
  info_upload_data: