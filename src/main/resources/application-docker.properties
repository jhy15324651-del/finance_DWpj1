# Docker Environment Configuration
# ===================================
# docker-compose up 시 자동 적용 (SPRING_PROFILES_ACTIVE=docker)

# Logging (Docker: INFO 수준, 컨테이너 로그로 출력)
logging.level.org.zerock.finance_dwpj1=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# JPA (Docker: SQL 출력 최소화)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf (Docker: 캐시 활성화)
spring.thymeleaf.cache=true

# Tesseract OCR (Linux 컨테이너 경로)
tesseract.datapath=/usr/share/tesseract-ocr/5/tessdata

# File Upload (컨테이너 내부 경로 — 볼륨으로 영속화됨)
file.upload-path=/app/uploads
file.info-upload-path=/app/info_uploads

# 추천 디버그 모드 비활성화
recommendation.debug-mode=false