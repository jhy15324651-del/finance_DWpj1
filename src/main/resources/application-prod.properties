# Production Environment Configuration
# ===================================

# Logging (운영 환경: 필요한 로그만)
logging.level.org.zerock.finance_dwpj1=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.boot.context.properties=WARN

# JPA (운영 환경: SQL 출력 비활성화 - 성능)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf (운영 환경: 캐시 활성화 - 성능)
spring.thymeleaf.cache=true

# 추천 디버그 모드 (운영 환경: 비활성화)
recommendation.debug-mode=false

# Tesseract OCR (Linux 경로)
tesseract.datapath=/usr/share/tesseract-ocr/5/tessdata

# File Upload (Linux 경로)
file.upload-path=/var/www/finance/uploads
file.info-upload-path=/var/www/finance/info_uploads