spring.application.name=finance_DWpj1

# Active Profile
# 로컬 IntelliJ → dev (기본값)
# Docker Compose → docker (docker-compose.yml에서 SPRING_PROFILES_ACTIVE=docker 주입)
# EC2/운영      → prod (.env 또는 환경변수에서 SPRING_PROFILES_ACTIVE=prod 설정)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# AI Provider Configuration
# ===================================
# AI Provider 선택: openai 또는 gemini (기본값: gemini)
ai.provider=gemini

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY:your-openai-api-key-here}
openai.model=gpt-3.5-turbo
openai.model-premium=gpt-4

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.model=gemini-2.5-flash
gemini.model-premium=gemini-1.5-pro

ai.logging.enabled=true
ai.logging.max-prompt-length=500
ai.logging.max-response-length=1000

# MariaDB Configuration
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://192.168.0.46:3307/finance_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:jhy}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Scheduler Configuration
spring.task.scheduling.pool.size=5

# Cache Configuration
stock.cache.quote-ttl=15
stock.cache.candle-daily-ttl=360
stock.cache.candle-weekly-ttl=1440

# Tesseract OCR Configuration
tesseract.datapath=${TESSERACT_DATAPATH:/usr/share/tesseract-ocr/5/tessdata}
tesseract.language=eng+kor
tesseract.ocr-engine-mode=3
tesseract.page-seg-mode=6

# File Upload Configuration
file.upload-path=${FILE_UPLOAD_PATH:/app/uploads}
file.info-upload-path=${FILE_INFO_UPLOAD_PATH:/app/info_uploads}

# AlphaVantage API Configuration
alphavantage.api.key=${ALPHAVANTAGE_API_KEY:your-alphavantage-api-key-here}
alphavantage.base-url=https://www.alphavantage.co/query

# Content Recommendation Configuration
# ===================================
# 콘텐츠 추천 알고리즘 가중치
recommendation.weight.tag-match=10
recommendation.weight.investor-boost-top1=30
recommendation.weight.investor-boost-top2=20
recommendation.weight.investor-boost-top3=10
recommendation.weight.overlap-ticker=15
recommendation.weight.rating=2
recommendation.weight.recency-week=20
recommendation.weight.recency-month=10
recommendation.weight.view-month=0.1
recommendation.weight.view-total=0.01

# 추천 후보 개수 및 결과 개수
recommendation.candidate-size=200
recommendation.result-size=5

# 디버그 모드 (추천 사유 로깅)
recommendation.debug-mode=true
